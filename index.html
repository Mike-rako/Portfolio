<!doctype html>
<html lang="es" class="intro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Michael Barillas | Desarrollador de software</title>
    <meta name="description" content="Portafolio de Michael Barillas, desarrollador de software enfocado en backend y automatizacion." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      /* Aplica el tema guardado antes del primer pintado para evitar parpadeos. */
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div class="iris" aria-hidden="true">
      <div class="iris-in">
        <h2><span><b>Michael</b></span> <span><b>Barillas</b></span></h2>
        <p>software developer</p>
      </div>
    </div>
    <header class="nav" id="nav">
      <a class="brand" href="#top">mb</a>
      <nav id="links" aria-label="Principal"></nav>
      <button id="lang" class="ib" type="button"></button>
      <button id="theme" class="ib" type="button" aria-label="Tema">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" /></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
      <button id="burger" class="ib burger" type="button" aria-label="Menu"><span></span><span></span></button>
    </header>
    <main id="top">
      <section id="hero"></section>
      <section id="experience" class="s"></section>
      <section id="skills" class="s"></section>
      <section id="projects" class="s"></section>
      <section id="contact" class="s"></section>
    </main>
    <footer id="footer"></footer>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
